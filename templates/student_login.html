<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student Login | Smart Attendance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='student_login.css') }}">
</head>
<body>

<!-- HEADER -->
<header class="topbar">
  <div class="brand">
    <div class="logo-box">🎓</div>
    <span>Smart Attendance</span>
  </div>

  <a href="#" class="teacher-link">👨‍🏫 Teacher Portal</a>
</header>

<!-- MAIN -->
<main class="page">
<button class="back-btn" onclick="goBack()">← Back</button>

  <div class="login-card">
    <div class="avatar">
      👤
    </div>

    <h1>Student Login</h1>
    <p class="subtitle">Welcome back! Please enter your details.</p>

    <form method="POST" action="{{ url_for('student_login') }}">
      <label>Roll Number</label>
      <div class="input-group">
        <span>🔒</span>
        <input type="text" placeholder="e.g., 2023CS101" name="reg">
      </div>

      <div class="password-row">
        <label>Password</label>
        <a href="#" class="forgot">Forgot?</a>
      </div>

      <div class="input-group">
        <span>🔒</span>
        <input type="password" name="password" placeholder="enter dob (dd/mm/yyyy)">
      </div>

      <div class="checkbox">
        <input type="checkbox" id="keep">
        <label for="keep">Keep me logged in</label>
      </div>

      <button type="submit">login</button>
    </form>

    <p class="switch">
      Are you a teacher?
      <a href="{{ url_for('teacher_login') }}" style="text-decoration: none;">Go to Teacher Portal</a>
    </p>
  </div>

</main>

<!-- FOOTER -->
<footer>
  <a href="#">Privacy Policy</a>
  <a href="#">Contact Support</a>
  <a href="#">Terms of Service</a>
</footer>

<script src="{{ url_for('static', filename='student_login.js') }}"></script>
</body>
</html>
